color3         #E5C890
color11        #E5C890

# sapphire #85C1DC
# blue     #8CAAEE - Functions
color4         #8CAAEE
color12        #8CAAEE

# mauve    #CA9EE6 - Keywords
# pink     #F4B8E4 - Numbers
color5         #F4B8E4
color13        #F4B8E4

# sky      #99D1DB
# teal     #81C8BE - Types
color6         #81C8BE
color14        #81C8BE

